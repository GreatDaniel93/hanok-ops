<html lang="en"><head>

<style>
:root{--navy:#071a29;--navy2:#0d2c43;--ivory:#f7f3ec;--paper:#fffdf9;--gold:#bd985d;--gold2:#e0c68e;--text:#142532;--muted:#74808a;--line:#e4ddd3;--red:#d94d5c;--blue:#4f87c6;--green:#389468;--amber:#c78c38}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--ivory);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;background:radial-gradient(circle at 80% 10%,#173c55 0,transparent 33%),linear-gradient(160deg,#061724,#0b263a 70%,#061724);display:grid;place-items:center;padding:24px}.loginWrap{width:min(440px,100%)}.brand{font:700 44px Georgia,serif;color:white;letter-spacing:-1px}.eyebrow{color:#cdb481;letter-spacing:.16em;font-size:10px;margin-bottom:8px}.tag{color:#9db0bd;font-size:12px;margin-top:5px}.loginCard{margin-top:28px;border:1px solid #ffffff18;background:#ffffff0d;border-radius:24px;padding:22px;backdrop-filter:blur(15px);box-shadow:0 24px 70px #0004}.loginCard h2{margin:0 0 5px;color:#fff;font-size:21px}.loginCard p{margin:0 0 16px;color:#9eb0bd;font-size:12px}.field{display:block;margin:12px 0 7px;color:#d8e0e5;font-size:11px;font-weight:800}.loginCard select,.loginCard input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff1d;background:#ffffff0e;color:#fff;outline:none}.loginCard select option{color:#111}.loginCard input::placeholder{color:#80909b}.primary{width:100%;border:0;border-radius:13px;padding:14px 16px;background:linear-gradient(135deg,#d0ae70,#96703f);color:#fff;font-weight:800;margin-top:16px;box-shadow:0 10px 24px #8f6a3c30}.error{min-height:18px;color:#ff9ba6;font-size:11px;margin-top:8px}.loginFoot{text-align:center;color:#718795;font-size:10px;margin-top:14px}
.shell{min-height:100vh}.top{background:linear-gradient(145deg,#071a29,#0d2c43);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 26px}.topInner{max-width:760px;margin:auto}.topRow{display:flex;align-items:center;justify-content:space-between}.storeName{font:700 27px Georgia,serif}.portalTag{color:#9fb0bc;font-size:10px;letter-spacing:.14em;margin-top:3px}.logout{border:1px solid #ffffff1d;background:#ffffff0a;color:#d8e1e7;border-radius:999px;padding:8px 12px;font-size:11px}.hello{margin-top:21px;font-size:18px;font-weight:800}.sub{color:#a7b5bf;font-size:12px;margin-top:3px}.sync{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:#8ca0ad;font-size:10px}.sync i{width:7px;height:7px;background:#51b783;border-radius:50%}
.main{max-width:760px;margin:-14px auto 0;padding:0 14px 50px}.report{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fffdf9,#f4ecdd);border:1px solid #dfd3bf;border-radius:19px;padding:17px;box-shadow:0 12px 30px #24384b13}.report h2{font:700 21px Georgia,serif;margin:0}.report p{font-size:11px;color:#79838b;margin:5px 0 0}.plus{width:48px;height:48px;border-radius:24px;border:0;background:linear-gradient(135deg,#d0ae70,#946c38);color:#fff;font-size:25px;box-shadow:0 10px 22px #7e5b3035}
.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 10px}.tabs button{border:1px solid var(--line);background:white;color:#6d7881;border-radius:999px;padding:8px 12px;font-size:11px}.tabs .active{background:var(--navy);color:white;border-color:var(--navy)}.sectionTitle{font-size:16px;font-weight:850;margin:14px 2px 9px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px #25364709}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.ticket{position:relative}.ticket h3{font-size:15px;margin:9px 0 5px}.ticket p{font-size:12px;color:#697680;line-height:1.4;margin:0;padding-right:18px}.ticketNo{font-size:10px;color:#8a949b}.age{font-size:10px;color:#8b949b}.chev{position:absolute;right:14px;bottom:18px;color:#98a2aa}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.pill.red{background:#ffe7ea;color:#bd3343}.pill.blue{background:#e9f2ff;color:#2e6fac}.pill.gold{background:#f9edd9;color:#9a6620}.pill.green{background:#e7f5ec;color:#287c55}.pill.gray{background:#edf0f2;color:#65717b}.empty{text-align:center;color:#8c969e;padding:48px 20px}
.overlay{position:fixed;z-index:20;inset:0;background:#071a29;display:none;overflow:auto}.overlay.show{display:block}.overlayTop{color:white;display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 16px 14px}.overlayTop button{border:0;background:none;color:white;font-size:24px}.sheet{background:var(--ivory);min-height:calc(100vh - 58px);border-radius:23px 23px 0 0;padding:16px 14px 32px}.sheetInner{max-width:720px;margin:auto}.detailCard{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.detailCard h1{font:700 25px Georgia,serif;margin:10px 0 5px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f4f1ec;border-radius:13px;padding:11px;margin:14px 0;font-size:11px}.meta b{display:block;font-size:10px;color:#77828a;margin-bottom:3px}.desc{font-size:13px;line-height:1.55;color:#5d6b75}.timeline{margin-top:18px}.tl{display:grid;grid-template-columns:12px 1fr auto;gap:7px;margin:12px 0;font-size:10px}.tl i{width:7px;height:7px;background:var(--gold);border-radius:50%;margin-top:4px}.tl strong{display:block;font-size:11px}.tl span{color:#8a949b}.comment{background:#f5f2ed;border-radius:11px;padding:10px 11px;margin-top:8px}.comment b{font-size:10px}.comment p{margin:4px 0 0;font-size:12px;color:#65717a}.attachments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.attachment{border:1px solid var(--line);background:#f7f4ef;border-radius:12px;overflow:hidden;min-height:72px;display:grid;place-items:center}.attachment img{width:100%;height:140px;object-fit:cover;display:block}.attachment button{width:100%;height:100%;min-height:72px;border:0;background:#f4f0e9;color:#42515c;font-weight:800;font-size:11px}.reopenBox{margin-top:14px;background:#fff4e3;border:1px solid #ead5ad;border-radius:13px;padding:12px}.reopenBox b{font-size:11px}.reopenBox p{font-size:11px;color:#765f39;margin:5px 0 0}.form label{display:block;font-size:11px;font-weight:850;margin:13px 0 7px}.form input,.form textarea,.form select{width:100%;border:1px solid #ded7ce;background:white;border-radius:12px;padding:13px;outline:none}.form textarea{min-height:100px;resize:none}.secondary{width:100%;border:1px solid #d8d1c8;background:white;color:#263846;border-radius:12px;padding:13px;font-weight:800;margin-top:9px}.toast{position:fixed;z-index:99;left:50%;bottom:30px;transform:translateX(-50%);background:#0b2538;color:white;padding:11px 16px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;max-width:85%;text-align:center}.toast.show{opacity:1}.loading{position:fixed;z-index:100;inset:0;background:#071a29cc;display:none;place-items:center}.loading.show{display:grid}.spin{width:34px;height:34px;border:3px solid #ffffff28;border-top-color:#d6b77a;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(min-width:700px){.top{padding-bottom:34px}.main{margin-top:-18px}.loginCard{padding:26px}}
</style></head>
<body><div id="app"></div><div id="overlay" class="overlay"></div><div id="toast" class="toast"></div><div id="loading" class="loading"><div class="spin"></div></div>
<script>
const SB_URL="https://tqfwbsjchespjkxliodo.supabase.co";
const SB_KEY="sb_publishable_gzlaNquJPCOsgVMb1ZhRdw_X38GSi6s";
const STORES=[
  {code:"HWD",name:"Hanok Woden"},
  {code:"HWG",name:"Hanok Wagga"},
  {code:"PDL",name:"Pandan Leaf"},
  {code:"MTH",name:"Meathouse"},
  {code:"BTD",name:"BBQTOWN Dickson"}
];
let session=JSON.parse(localStorage.getItem("hanok_store_session")||"null"),profile=null,store=null,tickets=[],filter="open",timer=null;
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
function showLoading(v){document.getElementById("loading").className="loading"+(v?" show":"")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1700)}
function h(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(s){if(!s)return"-";return new Intl.DateTimeFormat("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(s))}
function age(s){const m=(Date.now()-new Date(s))/60000;if(m<2)return"Just now";if(m<60)return Math.floor(m)+"m ago";if(m<1440)return Math.floor(m/60)+"h ago";return Math.floor(m/1440)+"d ago"}
function statusLabel(s){return({new:"New",accepted:"Accepted",in_progress:"In Progress",waiting:"Waiting",completed:"Completed"})[s]||s}
function cls(t){if(t.priority==="urgent"&&t.status!=="completed")return"red";if(t.status==="waiting")return"gold";if(t.status==="completed")return"green";return"blue"}
function internalEmail(code){return "store."+code.toLowerCase()+"@hanokops.invalid"}
function headers(extra={}){return {"apikey":SB_KEY,"Authorization":"Bearer "+session.access_token,...extra}}
async function refresh(){if(!session?.refresh_token)return false;try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)throw 0;session=await r.json();localStorage.setItem("hanok_store_session",JSON.stringify(session));return true}catch{logout();return false}}
async function api(path,opts={}){const r=await fetch(SB_URL+path,{...opts,headers:{...headers(),...(opts.headers||{})}});if(r.status===401&&await refresh())return api(path,opts);if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||j.error_description||j.details||"Request failed")}if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null}
function loginPage(){app.innerHTML='<div class="login"><div class="loginWrap"><div class="eyebrow">STORE PORTAL</div><div class="brand">Hanok Ops</div><div class="tag">Report issues. Track progress. Stay informed.</div><div class="loginCard"><h2>Store sign in</h2><p>Select your store and enter the store password.</p><label class="field">STORE / USERNAME</label><select id="storeSel">'+STORES.map(s=>'<option value="'+s.code+'">'+s.name+'</option>').join("")+'</select><label class="field">PASSWORD</label><input id="pwd" type="password" autocomplete="current-password" placeholder="Store password"><div id="err" class="error"></div><button class="primary" onclick="login()">Sign in</button></div><div class="loginFoot">Hanok Group  -  Internal Operations</div></div></div>'}
async function login(){const code=document.getElementById("storeSel").value,p=document.getElementById("pwd").value,e=document.getElementById("err");e.textContent="";if(!p){e.textContent="Enter the store password.";return}showLoading(true);try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:internalEmail(code),password:p})});const j=await r.json();if(!r.ok)throw new Error("Incorrect store or password.");session=j;localStorage.setItem("hanok_store_session",JSON.stringify(session));await boot()}catch(x){e.textContent=x.message}finally{showLoading(false)}}
function logout(){clearInterval(timer);session=null;profile=null;store=null;tickets=[];localStorage.removeItem("hanok_store_session");loginPage()}
async function boot(){if(!session){loginPage();return}showLoading(true);try{const ps=await api("/rest/v1/ops_profiles?user_id=eq."+session.user.id+"&select=user_id,display_name,role,store_id");profile=ps?.[0];if(!profile||profile.role!=="store"||!profile.store_id)throw new Error("This account is not assigned to a store.");const ss=await api("/rest/v1/ops_stores?id=eq."+profile.store_id+"&select=id,code,name,active");store=ss?.[0];if(!store)throw new Error("Store not found.");await loadTickets();clearInterval(timer);timer=setInterval(()=>loadTickets(true),10000)}catch(e){toast(e.message);logout()}finally{showLoading(false)}}
async function loadTickets(silent=false){try{tickets=await api("/rest/v1/ops_tickets?select=id,ticket_no,title,description,reported_by,category,priority,status,due_at,follow_up_at,waiting_reason,resolution,created_at,updated_at&order=created_at.desc&limit=150")||[];render()}catch(e){if(!silent)toast(e.message)}}
function card(t){return '<div class="card ticket" onclick="detail(\''+t.id+'\')"><div class="row between"><div class="row"><span class="pill '+cls(t)+'">'+(t.priority==="urgent"&&t.status!=="completed"?"Urgent":statusLabel(t.status))+'</span><span class="ticketNo">'+store.code+'-'+String(t.ticket_no||0).padStart(5,"0")+'</span></div><span class="age">'+age(t.created_at)+'</span></div><h3>'+h(t.title)+'</h3><p>'+h(t.description||t.category)+'</p><span class="chev">></span></div>'}
function render(){if(!session||!store){loginPage();return}let arr=tickets;if(filter==="open")arr=tickets.filter(t=>t.status!=="completed");if(filter==="waiting")arr=tickets.filter(t=>t.status==="waiting");if(filter==="completed")arr=tickets.filter(t=>t.status==="completed");app.innerHTML='<div class="shell"><div class="top"><div class="topInner"><div class="topRow"><div><div class="storeName">'+h(store.name)+'</div><div class="portalTag">HANOK OPS  -  STORE PORTAL</div></div><button class="logout" onclick="logout()">Sign out</button></div><div class="hello">Store operations</div><div class="sub">Report an issue and track HQ progress here.</div><div class="sync"><i></i> Connected  -  auto-sync every 10s</div></div></div><main class="main"><div class="report"><div><h2>Report an issue</h2><p>Maintenance, stock, IT, staff, landlord and more.</p></div><button class="plus" onclick="newTicket()">+</button></div><div class="tabs">'+["open","waiting","completed"].map(x=>'<button class="'+(filter===x?"active":"")+'" onclick="filter=\''+x+'\';render()">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'</div><div class="sectionTitle">My Tickets</div>'+(arr.length?arr.map(card).join(""):'<div class="empty">No tickets in this section.</div>')+'</main></div>'}
function closeOverlay(){overlay.className="overlay";overlay.innerHTML=""}
function newTicket(){overlay.className="overlay show";overlay.innerHTML='<div class="overlayTop"><button onclick="closeOverlay()"><</button><b>Report Issue</b><button></button></div><div class="sheet"><div class="sheetInner form"><div class="detailCard"><label>Reported by</label><input id="reportedBy" maxlength="100" placeholder="Your name, e.g. Jack"><label>Category</label><select id="cat">'+["Maintenance","Supplier / Stock","IT / POS","Marketing","HR / Staff","Finance","Landlord / Centre","Health & Safety","Other"].map(x=>'<option>'+x+'</option>').join("")+'</select><label>Title</label><input id="title" placeholder="What needs attention?"><label>Description</label><textarea id="desc" placeholder="Tell HQ what happened and what you need."></textarea><label>Priority</label><select id="pri"><option value="normal">Normal</option><option value="urgent">Urgent</option></select><label>Photo / Video</label><input id="file" type="file" accept="image/*,video/*"><button class="primary" onclick="createTicket()">Submit to HQ</button></div></div></div>'}
async function upload(ticketId,file){if(!file)return;const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=ticketId+"/"+Date.now()+"_"+clean;const r=await fetch(SB_URL+"/storage/v1/object/ops-ticket-attachments/"+encodeURI(path),{method:"POST",headers:{...headers({"Content-Type":file.type||"application/octet-stream","x-upsert":"false"})},body:file});if(!r.ok)throw new Error("Attachment upload failed");await api("/rest/v1/ops_ticket_attachments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:ticketId,uploaded_by:session.user.id,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size})})}
async function createTicket(){const title=document.getElementById("title").value.trim();if(!title){toast("Add a title.");return}showLoading(true);try{const created=await api("/rest/v1/ops_tickets",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({store_id:store.id,created_by:session.user.id,title,description:document.getElementById("desc").value.trim(),reported_by:(document.getElementById("reportedBy").value.trim()||null),category:document.getElementById("cat").value,priority:document.getElementById("pri").value})});const file=document.getElementById("file").files[0];if(file&&created?.[0])await upload(created[0].id,file);closeOverlay();await loadTickets();toast("Issue sent to HQ.")}catch(e){toast(e.message)}finally{showLoading(false)}}
async function detail(id){const t=tickets.find(x=>x.id===id);if(!t)return;overlay.className="overlay show";overlay.innerHTML='<div class="overlayTop"><button onclick="closeOverlay()"><</button><b>Ticket Detail</b><button></button></div><div class="sheet"><div class="sheetInner"><div class="detailCard"><div class="row between"><span class="pill '+cls(t)+'">'+(t.priority==="urgent"&&t.status!=="completed"?"Urgent":statusLabel(t.status))+'</span><span class="ticketNo">'+store.code+'-'+String(t.ticket_no||0).padStart(5,"0")+'</span></div><h1>'+h(t.title)+'</h1><p class="desc">'+h(t.description||"No description.")+'</p><div class="meta"><div><b>CATEGORY</b>'+h(t.category)+'</div><div><b>REPORTED BY</b>'+h(t.reported_by||"-")+'</div><div><b>STATUS</b>'+statusLabel(t.status)+'</div><div><b>CREATED</b>'+fmt(t.created_at)+'</div><div><b>DUE</b>'+fmt(t.due_at)+'</div></div>'+(t.status==="waiting"?'<div class="card" style="background:#fbf0df"><b style="font-size:11px">Waiting</b><p style="font-size:12px;margin:5px 0 0;color:#7c622f">'+h(t.waiting_reason||"HQ follow-up pending")+(t.follow_up_at?"  -  "+fmt(t.follow_up_at):"")+'</p></div>':"")+(t.status==="completed"&&t.resolution?'<div class="card" style="background:#eaf6ee"><b style="font-size:11px">Resolution</b><p style="font-size:12px;margin:5px 0 0;color:#426c55">'+h(t.resolution)+'</p></div>':"")+'<div id="attachmentsWrap"><b>Attachments</b><div id="attachments" class="attachments"><div class="empty" style="padding:12px">Loading...</div></div></div><div id="reopenWrap"></div><div id="events" class="timeline"><b>Timeline</b><div class="empty" style="padding:18px">Loading...</div></div><div id="comments"><b>Comments</b><div class="empty" style="padding:18px">Loading...</div></div><div class="form"><label>Add comment</label><textarea id="comment" placeholder="Add an update for HQ..."></textarea><button class="secondary" onclick="comment(\''+id+'\')">Post comment</button></div></div></div></div>';try{const [ev,co,at,rr]=await Promise.all([api("/rest/v1/ops_ticket_events?ticket_id=eq."+id+"&select=id,event_type,message,created_at&order=created_at.asc"),api("/rest/v1/ops_ticket_comments?ticket_id=eq."+id+"&select=id,body,created_at&order=created_at.asc"),api("/rest/v1/ops_ticket_attachments?ticket_id=eq."+id+"&select=id,storage_path,file_name,mime_type,created_at&order=created_at.asc"),api("/rest/v1/ops_reopen_requests?ticket_id=eq."+id+"&select=id,reason,status,created_at,reviewed_at&order=created_at.desc")]);document.getElementById("events").innerHTML='<b>Timeline</b>'+(ev?.length?ev.map(e=>'<div class="tl"><i></i><div><strong>'+h(e.message||e.event_type)+'</strong><span>'+h(e.event_type.replaceAll("_"," "))+'</span></div><span>'+fmt(e.created_at)+'</span></div>').join(""):'<div class="empty" style="padding:18px">No events yet.</div>');document.getElementById("comments").innerHTML='<b>Comments</b>'+(co?.length?co.map(c=>'<div class="comment"><b>'+fmt(c.created_at)+'</b><p>'+h(c.body)+'</p></div>').join(""):'<div class="empty" style="padding:18px">No comments yet.</div>');await renderAttachments(at||[]);if(t.status==="completed")renderReopen(id,rr||[])}catch(e){toast(e.message)}}
async function renderAttachments(list){const box=document.getElementById("attachments");if(!box)return;if(!list.length){box.innerHTML='<div style="font-size:11px;color:#8c969e">No attachments.</div>';return}box.innerHTML="";for(const a of list){const el=document.createElement("div");el.className="attachment";if((a.mime_type||"").startsWith("image/")){el.innerHTML='<button>Loading image...</button>';try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:headers()});if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b);el.innerHTML='<img alt="'+h(a.file_name)+'">';el.querySelector("img").src=u;el.onclick=()=>window.open(u,"_blank")}catch{el.innerHTML='<button>Could not load '+h(a.file_name)+'</button>'}}else{el.innerHTML='<button>Play  '+h(a.file_name)+'</button>';el.onclick=()=>openAttachment(a)}box.appendChild(el)}}
async function openAttachment(a){showLoading(true);try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:headers()});if(!r.ok)throw new Error("Could not open attachment");const b=await r.blob(),u=URL.createObjectURL(b);window.open(u,"_blank")}catch(e){toast(e.message)}finally{showLoading(false)}}
function renderReopen(id,list){const box=document.getElementById("reopenWrap");if(!box)return;const pending=list.find(x=>x.status==="pending");if(pending){box.innerHTML='<div class="reopenBox"><b>Reopen requested</b><p>'+h(pending.reason)+'  -  Waiting for HQ review.</p></div>';return}box.innerHTML='<div class="reopenBox"><b>Still not resolved?</b><p>If the issue remains after completion, ask HQ to reopen this ticket.</p><button class="secondary" onclick="reopenForm(\''+id+'\')">Issue not resolved</button></div>'}
function reopenForm(id){overlay.innerHTML='<div class="overlayTop"><button onclick="detail(\''+id+'\')"><</button><b>Request Reopen</b><button></button></div><div class="sheet"><div class="sheetInner form"><div class="detailCard"><label>What is still wrong?</label><textarea id="reopenReason" placeholder="Explain why this issue is not resolved."></textarea><button class="primary" onclick="requestReopen(\''+id+'\')">Send to HQ</button></div></div></div>'}
async function requestReopen(id){const reason=document.getElementById("reopenReason").value.trim();if(reason.length<3){toast("Please add a short reason.");return}showLoading(true);try{await api("/rest/v1/ops_reopen_requests",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:id,store_id:store.id,requested_by:session.user.id,reason})});await detail(id);toast("Reopen request sent to HQ.")}catch(e){toast(e.message)}finally{showLoading(false)}}
async function comment(id){const body=document.getElementById("comment").value.trim();if(!body)return;showLoading(true);try{await api("/rest/v1/ops_ticket_comments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:id,author_id:session.user.id,body})});await detail(id);toast("Comment added.")}catch(e){toast(e.message)}finally{showLoading(false)}}
if(session)boot();else loginPage();
</script></body></html>
