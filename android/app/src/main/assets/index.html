<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071a29"><title>Hanok Ops</title>
<style>
:root{--navy:#071a29;--navy2:#0d2b41;--ivory:#f6f2ea;--paper:#fffdf9;--gold:#b79254;--gold2:#d9bd83;--text:#112230;--muted:#77828c;--red:#d94e5b;--blue:#4d87ca;--green:#3d946b;--amber:#c98d36;--line:#e5ddd2}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--navy);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{height:100%;overflow:hidden;background:var(--ivory)}.hidden{display:none!important}.screen{height:100%;display:flex;flex-direction:column}.top{background:linear-gradient(160deg,#061827,#0c2a40);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 20px}.brand{font:700 30px Georgia,serif}.tagline{font-size:11px;letter-spacing:.12em;color:#9fb0bd;margin-top:2px}.headrow{display:flex;justify-content:space-between;align-items:center}.iconBtn{width:38px;height:38px;border:1px solid #ffffff1e;background:#ffffff09;color:#fff;border-radius:19px}.greet{font-size:21px;font-weight:750;margin-top:19px}.sub{color:#a8b5bf;font-size:12px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{border:1px solid #ffffff16;background:#ffffff0b;border-radius:15px;padding:11px 6px;text-align:center}.stat b{display:block;font-size:23px}.stat small{font-size:10px}.stat.red{color:#ff8290}.stat.blue{color:#82b7f4}.stat.gold{color:#e7c984}.content{flex:1;overflow:auto;padding:0 14px calc(86px + env(safe-area-inset-bottom));scrollbar-width:none}.content::-webkit-scrollbar{display:none}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-size:17px;font-weight:800}.sectionTitle button{border:0;background:none;color:var(--muted);font-size:11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #263b4d0b;margin-bottom:10px}.ticket{padding:13px 14px;position:relative}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.pill{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:capitalize}.pill.red{background:#ffe8eb;color:#bd3342}.pill.blue{background:#e8f2ff;color:#2f6fab}.pill.gold{background:#f8ecd9;color:#986422}.pill.green{background:#e6f5ec;color:#287b56}.pill.gray{background:#edf0f2;color:#67737d}.store{font-size:11px;color:#56636e;font-weight:700}.age{font-size:10px;color:#8b949c}.ticket h3{margin:9px 0 4px;font-size:15px}.ticket p{margin:0;color:#697680;font-size:12px;line-height:1.4;padding-right:18px}.chev{position:absolute;right:14px;bottom:17px;color:#9aa4ac}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#071a29f2;border-top:1px solid #ffffff15;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(16px)}.nav button{border:0;background:none;color:#7f909d;font-size:10px;display:grid;place-items:center;align-content:center;gap:4px}.nav button b{font-size:19px;font-weight:400}.nav button.active{color:#e4bf77}.fab{position:fixed;z-index:31;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;border:0;background:linear-gradient(135deg,#d9b97d,#9b7139);color:#fff;font-size:27px;box-shadow:0 12px 30px #6a4b284c}.pageHead{background:linear-gradient(160deg,#061827,#0d2a40);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 18px 18px;display:flex;justify-content:space-between;align-items:center}.pageHead h1{font:700 27px Georgia,serif;margin:0}.pageHead button{background:none;border:0;color:white;font-size:20px}.filters{display:flex;gap:7px;padding:10px 14px 6px;overflow:auto}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;color:#66717a;white-space:nowrap}.filters .active{background:var(--navy);color:#fff;border-color:var(--navy)}.storeCard{padding:12px 13px}.storeCard h3{margin:0;font-size:14px}.address{font-size:10px;color:#8b949d;margin-top:3px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.kpi{border-radius:10px;padding:7px 3px;text-align:center;font-size:9px}.kpi b{display:block;font-size:14px}.kpi.open{background:#e9f3ff;color:#2867ab}.kpi.urgent{background:#ffe9ec;color:#b93644}.kpi.wait{background:#fbefdc;color:#96641f}.kpi.done{background:#e7f5ec;color:#287b54}.overlay{position:fixed;z-index:100;inset:0;background:var(--navy);display:none;overflow:auto}.overlay.show{display:block}.detailTop{padding:calc(22px + env(safe-area-inset-top)) 16px 13px;color:#fff;display:flex;justify-content:space-between;align-items:center}.detailTop button{border:0;background:none;color:#fff;font-size:24px}.sheet{background:var(--ivory);min-height:calc(100% - 62px);border-radius:24px 24px 0 0;padding:16px 14px calc(92px + env(safe-area-inset-bottom))}.detailCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.detailCard h2{font:700 25px Georgia,serif;margin:8px 0 6px}.desc{font-size:13px;color:#5f6c76;line-height:1.5}.meta{background:#f4f1ec;border-radius:13px;padding:11px 12px;margin:14px 0;display:grid;gap:9px;font-size:12px}.timeline{margin-top:16px}.tl{display:grid;grid-template-columns:14px 1fr auto;gap:8px;margin:12px 0;font-size:11px}.tl i{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:4px}.tl strong{display:block;font-size:12px}.tl span{color:#8b949c}.actions{position:fixed;z-index:110;left:0;right:0;bottom:0;background:#fffdf9f3;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);backdrop-filter:blur(16px)}.actions button{border:1px solid #d9d3ca;background:#fff;border-radius:11px;padding:13px 5px;font-size:12px;font-weight:800}.actions .complete{background:linear-gradient(135deg,#cba967,#8f6835);border:0;color:#fff}.form label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}.form input,.form textarea,.form select{width:100%;border:1px solid #ded7cd;background:#fff;border-radius:12px;padding:13px;color:#182633;outline:none}.form textarea{min-height:95px;resize:none}.primary{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,#cba967,#8f6835);color:#fff;font-weight:800;padding:15px;margin-top:18px}.secondary{width:100%;border:1px solid #d8d2c8;border-radius:13px;background:#fff;color:#253645;font-weight:800;padding:14px;margin-top:9px}.login{height:100%;background:linear-gradient(165deg,#061827 0,#0d2b41 55%,#0b2030 100%);color:#fff;padding:calc(50px + env(safe-area-inset-top)) 24px 24px;display:flex;flex-direction:column}.loginLogo{font:700 42px Georgia,serif}.loginTag{color:#a9b6c0;letter-spacing:.13em;font-size:10px;margin-top:5px}.loginBox{margin-top:auto;margin-bottom:auto;background:#ffffff0d;border:1px solid #ffffff16;border-radius:22px;padding:18px;backdrop-filter:blur(16px)}.loginBox h2{margin:0 0 5px;font-size:21px}.loginBox p{margin:0 0 14px;color:#aab7c0;font-size:12px}.loginBox input{width:100%;background:#ffffff0d;color:#fff;border:1px solid #ffffff1c;border-radius:12px;padding:13px;margin:6px 0;outline:none}.loginBox input::placeholder{color:#8595a1}.loginBox .primary{margin-top:10px}.loginBox .secondary{background:#ffffff09;color:#d9e1e6;border-color:#ffffff1d}.error{color:#ff93a0;font-size:11px;min-height:16px;margin-top:7px}.sync{font-size:10px;color:#8fa0ac;display:flex;align-items:center;gap:5px}.sync i{width:7px;height:7px;border-radius:50%;background:#4db57e}.pending{padding:22px;text-align:center}.pending h2{font:700 25px Georgia,serif}.pending p{font-size:13px;color:#66737d;line-height:1.5}.empty{text-align:center;padding:45px 20px;color:#89949c}.toast{position:fixed;z-index:200;left:50%;bottom:100px;transform:translateX(-50%);background:#0b2437;color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:85%;text-align:center}.toast.show{opacity:1}.loading{position:fixed;z-index:250;inset:0;background:#071a29cc;color:#fff;display:none;place-items:center}.loading.show{display:grid}.spinner{width:34px;height:34px;border:3px solid #ffffff2b;border-top-color:#d9bd83;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.comment{padding:10px 12px;background:#f5f2ed;border-radius:11px;margin-top:8px}.comment b{font-size:11px}.comment p{font-size:12px;margin:4px 0 0;color:#66727c}.attachments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}.attachment{border:1px solid var(--line);background:#f5f2ed;border-radius:12px;overflow:hidden;min-height:72px;display:grid;place-items:center}.attachment img{width:100%;height:130px;object-fit:cover}.attachment button{width:100%;height:100%;min-height:72px;border:0;background:#f5f2ed;font-size:11px;font-weight:800;color:#42515c}.notice{padding:12px 13px}.notice.unread{border-left:3px solid var(--gold)}.notice h3{margin:7px 0 4px;font-size:14px}.notice p{margin:0;font-size:11px;color:#697680}.reopenCard{background:#fff3df;border:1px solid #ead1a2;border-radius:13px;padding:12px;margin:12px 0}.reopenCard p{font-size:11px;color:#735c32;line-height:1.45}.reopenActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reopenActions button{border:1px solid #d9d0c3;background:#fff;border-radius:10px;padding:11px;font-weight:800}.reopenActions .approve{background:#193149;color:#fff;border-color:#193149}
</style></head><body>
<div id="app"></div><div id="detail" class="overlay"></div><div id="toast" class="toast"></div><div id="loading" class="loading"><div class="spinner"></div></div>
<script>
const SB_URL="https://tqfwbsjchespjkxliodo.supabase.co";
const SB_KEY="sb_publishable_gzlaNquJPCOsgVMb1ZhRdw_X38GSi6s";
let session=JSON.parse(localStorage.getItem("hanokops_session")||"null");
let profile=null, stores=[], tickets=[], notifications=[], page="home", filter="active", refreshTimer=null;
const app=document.getElementById("app"), detail=document.getElementById("detail");

function showLoading(v){document.getElementById("loading").className="loading"+(v?" show":"")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1700)}
function fmtDate(s){if(!s)return "—";try{return new Intl.DateTimeFormat("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(s))}catch{return s}}
function age(s){const d=(Date.now()-new Date(s).getTime())/60000;if(d<2)return"Just now";if(d<60)return Math.floor(d)+"m ago";if(d<1440)return Math.floor(d/60)+"h ago";return Math.floor(d/1440)+"d ago"}
function statusClass(s){return s==="completed"?"green":s==="waiting"?"gold":(s==="new"||s==="accepted"||s==="in_progress")?"blue":"gray"}
function statusLabel(s){return ({new:"New",accepted:"Accepted",in_progress:"In Progress",waiting:"Waiting",completed:"Completed"})[s]||s}
function storeFor(id){return stores.find(s=>s.id===id)||{name:"Store",code:"OPS"}}
function ticketId(t){const s=storeFor(t.store_id);return s.code+"-"+String(t.ticket_no||0).padStart(5,"0")}
function authHeaders(extra={}){return {"apikey":SB_KEY,"Authorization":"Bearer "+session.access_token,...extra}}

async function api(path,opts={}){
  if(!session)throw new Error("Not signed in");
  const res=await fetch(SB_URL+path,{...opts,headers:{...authHeaders(),...(opts.headers||{})}});
  if(res.status===401 && session.refresh_token){
    const ok=await refreshSession();
    if(ok)return api(path,opts);
  }
  if(!res.ok){let msg="Request failed";try{const j=await res.json();msg=j.message||j.error_description||j.hint||j.details||msg}catch{}throw new Error(msg)}
  if(res.status===204)return null;
  const txt=await res.text();return txt?JSON.parse(txt):null;
}

async function refreshSession(){
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok)throw 0;session=await r.json();localStorage.setItem("hanokops_session",JSON.stringify(session));return true;
  }catch{logout(false);return false}
}

async function signIn(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const err=document.getElementById("loginErr");err.textContent="";showLoading(true);
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Sign in failed");
    session=j;localStorage.setItem("hanokops_session",JSON.stringify(session));await boot();
  }catch(e){err.textContent=e.message}finally{showLoading(false)}
}
async function signUp(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const err=document.getElementById("loginErr");err.textContent="";
  if(!email||password.length<8){err.textContent="Enter an email and password of at least 8 characters.";return}
  showLoading(true);
  try{
    const r=await fetch(SB_URL+"/auth/v1/signup",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password,data:{display_name:email.split("@")[0]}})});
    const j=await r.json();if(!r.ok)throw new Error(j.msg||j.message||"Account creation failed");
    if(j.access_token){session=j;localStorage.setItem("hanokops_session",JSON.stringify(session));await boot()}else{toast("Account created. Check your email, then sign in.")}
  }catch(e){err.textContent=e.message}finally{showLoading(false)}
}
function logout(render=true){session=null;profile=null;stores=[];tickets=[];localStorage.removeItem("hanokops_session");clearInterval(refreshTimer);if(render)showLogin()}

async function boot(){
  if(!session){showLogin();return}
  showLoading(true);
  try{
    const ps=await api("/rest/v1/ops_profiles?user_id=eq."+encodeURIComponent(session.user.id)+"&select=user_id,email,display_name,role,store_id");
    profile=ps&&ps[0];if(!profile)throw new Error("Profile not found");
    stores=await api("/rest/v1/ops_stores?select=id,code,name,active&active=eq.true&order=name.asc")||[];
    if(profile.role==="pending"){render();return}
    await Promise.all([loadTickets(true),loadNotifications(true)]);
    clearInterval(refreshTimer);refreshTimer=setInterval(()=>refreshAll(),12000);
    render();
  }catch(e){toast(e.message);if(/JWT|token|signed/i.test(e.message))logout()}finally{showLoading(false)}
}

async function loadTickets(silent=false){
  if(!profile||profile.role==="pending")return;
  try{
    const data=await api("/rest/v1/ops_tickets?select=id,ticket_no,store_id,created_by,assigned_to,title,description,reported_by,category,priority,status,due_at,follow_up_at,waiting_reason,resolution,created_at,updated_at,completed_at&order=created_at.desc&limit=200");
    tickets=data||[];if(!silent)render();else if(page==="home"||page==="tickets")render();
  }catch(e){if(!silent)toast(e.message)}
}
async function loadNotifications(silent=false){if(!profile||profile.role==="pending")return;try{notifications=await api("/rest/v1/ops_notifications?select=id,ticket_id,kind,title,body,priority,read_at,created_at,data&order=created_at.desc&limit=100")||[];notifyNewNotifications();if(!silent&&page==="alerts")render()}catch(e){if(!silent)toast(e.message)}}
function notifyNewNotifications(){let seen=[];try{seen=JSON.parse(localStorage.getItem("hanokops_notified_ids")||"[]")}catch{}const set=new Set(seen);let changed=false;for(const n of notifications){if(!n.read_at&&!set.has(n.id)){if(window.AndroidApp&&typeof window.AndroidApp.notify==="function"){try{window.AndroidApp.notify(n.title,n.body||"Hanok Ops alert")}catch{}}set.add(n.id);changed=true}}if(changed)localStorage.setItem("hanokops_notified_ids",JSON.stringify(Array.from(set).slice(-300)))}
async function refreshAll(){await Promise.all([loadTickets(true),loadNotifications(true)]);if(["home","tickets","alerts","stores"].includes(page))render()}
async function loadEvents(id){return await api("/rest/v1/ops_ticket_events?ticket_id=eq."+id+"&select=id,event_type,message,details,created_at&order=created_at.asc")||[]}
async function loadComments(id){return await api("/rest/v1/ops_ticket_comments?ticket_id=eq."+id+"&select=id,author_id,body,created_at&order=created_at.asc")||[]}

function showLogin(){
  app.innerHTML='<div class="login"><div><div class="loginLogo">Hanok Ops</div><div class="loginTag">ONE GROUP · EVERY STORE · ALWAYS IN CONTROL</div></div><div class="loginBox"><h2>Sign in</h2><p>Use your Hanok Ops account to continue.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div id="loginErr" class="error"></div><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div><div style="font-size:10px;color:#82929f;text-align:center">Hanok Group · Operations System · v0.3</div></div>'
}

function nav(){const unread=notifications.filter(n=>!n.read_at).length;
  return '<nav class="nav">'+[["⌂","Home","home"],["▤","Tickets","tickets"],["▦","Stores","stores"],["♢",unread?"Alerts "+unread:"Alerts","alerts"],["◉","Profile","profile"]].map(x=>'<button class="'+(page===x[2]?"active":"")+'" onclick="go(\''+x[2]+'\')"><b>'+x[0]+'</b>'+x[1]+'</button>').join("")+'</nav>'
}
function ticketCard(t){
  const s=storeFor(t.store_id), urgent=t.priority==="urgent";
  return '<div class="card ticket" onclick="openTicket(\''+t.id+'\')"><div class="row between"><div class="row"><span class="pill '+(urgent?"red":statusClass(t.status))+'">'+(urgent?"Urgent":statusLabel(t.status))+'</span><span class="store">'+s.name+'</span></div><span class="age">'+age(t.created_at)+'</span></div><h3>'+escapeHtml(t.title)+'</h3><p>'+escapeHtml(t.description||t.category)+'</p><span class="chev">›</span></div>'
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function isHQ(){return profile&&["admin","hq"].includes(profile.role)}
function activeTickets(){return tickets.filter(t=>t.status!=="completed")}

function home(){
  const open=activeTickets(),urgent=open.filter(t=>t.priority==="urgent").length, overdue=open.filter(t=>t.due_at&&new Date(t.due_at)<new Date()).length;
  return '<div class="screen"><div class="top"><div class="headrow"><div><div class="brand">Hanok Ops</div><div class="tagline">LIVE OPERATIONS</div></div><button class="iconBtn" onclick="loadTickets()">↻</button></div><div class="greet">Good '+(new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening")+', '+escapeHtml(profile.display_name||"Daniel")+'</div><div class="sub"><span class="sync"><i></i> Connected · auto-sync every 12s</span></div><div class="stats"><div class="stat red"><b>'+urgent+'</b><small>Urgent</small></div><div class="stat blue"><b>'+open.length+'</b><small>Open</small></div><div class="stat gold"><b>'+overdue+'</b><small>Overdue</small></div></div></div><main class="content"><div class="sectionTitle"><span>Needs Your Attention</span><button onclick="go(\'tickets\')">See all →</button></div>'+((open.length?open.slice(0,8).map(ticketCard).join(""):'<div class="empty">No active tickets.</div>'))+'</main>'+(isHQ()?'<button class="fab" onclick="newTicket()">+</button>':'<button class="fab" onclick="newTicket()">+</button>')+nav()+'</div>'
}
function ticketList(){
  let arr=tickets;
  if(filter==="active")arr=arr.filter(t=>t.status!=="completed");
  if(filter==="urgent")arr=arr.filter(t=>t.priority==="urgent"&&t.status!=="completed");
  if(filter==="waiting")arr=arr.filter(t=>t.status==="waiting");
  if(filter==="completed")arr=arr.filter(t=>t.status==="completed");
  return '<div class="screen"><div class="pageHead"><h1>Tickets</h1><button onclick="newTicket()">＋</button></div><div class="filters">'+["active","urgent","waiting","completed"].map(f=>'<button class="'+(filter===f?"active":"")+'" onclick="filter=\''+f+'\';render()">'+f[0].toUpperCase()+f.slice(1)+'</button>').join("")+'</div><main class="content" style="padding-top:7px">'+(arr.length?arr.map(ticketCard).join(""):'<div class="empty">Nothing here.</div>')+'</main>'+nav()+'</div>'
}
function storesPage(){
  return '<div class="screen"><div class="pageHead"><h1>Stores</h1><button onclick="loadTickets()">↻</button></div><main class="content" style="padding-top:14px">'+stores.map(s=>{const all=tickets.filter(t=>t.store_id===s.id),active=all.filter(t=>t.status!=="completed");return '<div class="card storeCard"><div class="row between"><div><h3>'+escapeHtml(s.name)+'</h3><div class="address">'+s.code+' · Hanok Group</div></div><span class="pill green">Active</span></div><div class="kpis"><div class="kpi open"><b>'+active.length+'</b>Open</div><div class="kpi urgent"><b>'+active.filter(t=>t.priority==="urgent").length+'</b>Urgent</div><div class="kpi wait"><b>'+active.filter(t=>t.status==="waiting").length+'</b>Waiting</div><div class="kpi done"><b>'+all.filter(t=>t.status==="completed").length+'</b>Done</div></div></div>'}).join("")+'</main>'+nav()+'</div>'
}
function noticeClass(n){return n.priority==="urgent"?"red":n.kind==="follow_up_due"||n.kind==="due_soon"?"gold":n.kind==="reopen_requested"?"blue":"gray"}
function alertsPage(){
  const unread=notifications.filter(n=>!n.read_at).length;
  return '<div class="screen"><div class="pageHead"><h1>Alerts</h1><button onclick="refreshAll()">↻</button></div><main class="content" style="padding-top:14px"><div class="sectionTitle"><span>Notifications</span><span style="font-size:11px;color:#7b858d">'+unread+' unread</span></div>'+(notifications.length?notifications.map(n=>'<div class="card notice '+(!n.read_at?"unread":"")+'" onclick="openNotification(\''+n.id+'\',\''+(n.ticket_id||"")+'\')"><div class="row between"><span class="pill '+noticeClass(n)+'">'+escapeHtml(n.kind.replaceAll("_"," "))+'</span><span class="age">'+age(n.created_at)+'</span></div><h3>'+escapeHtml(n.title)+'</h3><p>'+escapeHtml(n.body)+'</p></div>').join(""):'<div class="empty">No notifications yet.</div>')+'</main>'+nav()+'</div>'
}
function profilePage(){
  const s=profile.store_id?storeFor(profile.store_id):null;
  return '<div class="screen"><div class="pageHead"><h1>Profile</h1><button>⋮</button></div><main class="content" style="padding-top:14px"><div class="card ticket"><h3>'+escapeHtml(profile.display_name)+'</h3><p>'+escapeHtml(profile.email||"")+'</p><div style="margin-top:10px"><span class="pill blue">'+escapeHtml(profile.role)+'</span>'+(s?' <span class="pill gold">'+escapeHtml(s.name)+'</span>':'')+'</div></div><div class="card ticket"><h3>Hanok Ops v0.3</h3><p>Live Supabase sync is enabled. Tickets are shared across devices.</p></div><button class="secondary" onclick="logout()">Sign out</button></main>'+nav()+'</div>'
}
function pendingPage(){
  return '<div class="screen"><div class="pageHead"><h1>Hanok Ops</h1><button></button></div><main class="content" style="padding-top:30px"><div class="card pending"><span class="pill gold">Pending setup</span><h2>Your account is ready.</h2><p>This account has not yet been assigned to HQ or a store. Send the account email to the Hanok Ops administrator, then sign in again after assignment.</p><button class="secondary" onclick="logout()">Sign out</button></div></main></div>'
}
function render(){if(!session){showLogin();return}if(!profile)return;if(profile.role==="pending"){app.innerHTML=pendingPage();return}if(page==="home")app.innerHTML=home();else if(page==="tickets")app.innerHTML=ticketList();else if(page==="stores")app.innerHTML=storesPage();else if(page==="alerts")app.innerHTML=alertsPage();else app.innerHTML=profilePage()}
function go(p){page=p;render()}

async function openTicket(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;
  detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>Ticket Detail</b><button>⋮</button></div><div class="sheet"><div class="detailCard"><div class="row between"><div class="row"><span class="pill '+(t.priority==="urgent"?"red":statusClass(t.status))+'">'+(t.priority==="urgent"?"Urgent":statusLabel(t.status))+'</span><span class="store">'+ticketId(t)+'</span></div><span class="pill '+statusClass(t.status)+'">'+statusLabel(t.status)+'</span></div><h2>'+escapeHtml(t.title)+'</h2><div class="store">▦ '+escapeHtml(storeFor(t.store_id).name)+'</div><p class="desc">'+escapeHtml(t.description||"No description.")+'</p><div class="meta"><div><b>Category</b><br>'+escapeHtml(t.category)+'</div><div><b>Reported by</b><br>'+escapeHtml(t.reported_by||"—")+'</div><div><b>Due</b><br>'+fmtDate(t.due_at)+'</div><div><b>Created</b><br>'+fmtDate(t.created_at)+'</div></div><div id="attachmentsWrap"><b>Attachments</b><div id="attachments" class="attachments"><div class="empty" style="padding:12px">Loading…</div></div></div><div id="reopenWrap"></div><div id="timeline" class="timeline"><b>Timeline</b><div class="empty" style="padding:18px">Loading…</div></div><div id="comments"><b>Comments</b><div class="empty" style="padding:18px">Loading…</div></div><div class="form"><label>Add comment</label><textarea id="commentBody" placeholder="Add an update..."></textarea><button class="secondary" onclick="addComment(\''+t.id+'\')">Post comment</button></div></div></div>'+(isHQ()&&t.status!=="completed"?'<div class="actions"><button onclick="'+(t.status==="new"?'acceptTicket': 'startTicket')+'(\''+t.id+'\')">'+(t.status==="new"?'✓ Accept':'▶ Start Work')+'</button><button onclick="waitingForm(\''+t.id+'\')">◷ Waiting</button><button class="complete" onclick="completeForm(\''+t.id+'\')">✓ Complete</button></div>':'');
  try{
    const [ev,co,at,rr]=await Promise.all([loadEvents(id),loadComments(id),api("/rest/v1/ops_ticket_attachments?ticket_id=eq."+id+"&select=id,storage_path,file_name,mime_type,created_at&order=created_at.asc"),api("/rest/v1/ops_reopen_requests?ticket_id=eq."+id+"&select=id,reason,status,created_at,reviewed_at&order=created_at.desc")]);
    document.getElementById("timeline").innerHTML='<b>Timeline</b>'+(ev.length?ev.map(e=>'<div class="tl"><i></i><div><strong>'+escapeHtml(e.message||e.event_type)+'</strong><span>'+escapeHtml(e.event_type.replaceAll("_"," "))+'</span></div><span>'+fmtDate(e.created_at)+'</span></div>').join(""):'<div class="empty" style="padding:18px">No events yet.</div>');
    document.getElementById("comments").innerHTML='<b>Comments</b>'+(co.length?co.map(c=>'<div class="comment"><b>'+fmtDate(c.created_at)+'</b><p>'+escapeHtml(c.body)+'</p></div>').join(""):'<div class="empty" style="padding:18px">No comments yet.</div>');
    await renderAttachments(at||[]);renderReopenRequests(id,rr||[]);
  }catch(e){toast(e.message)}
}
function closeDetail(){detail.className="overlay";detail.innerHTML=""}
async function openNotification(notificationId,ticketId){try{await api("/rest/v1/ops_notifications?id=eq."+notificationId,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({read_at:new Date().toISOString()})});const n=notifications.find(x=>x.id===notificationId);if(n)n.read_at=new Date().toISOString();if(ticketId)openTicket(ticketId);else render()}catch(e){toast(e.message)}}
async function renderAttachments(list){const box=document.getElementById("attachments");if(!box)return;if(!list.length){box.innerHTML='<div style="font-size:11px;color:#8c969e">No attachments.</div>';return}box.innerHTML="";for(const a of list){const el=document.createElement("div");el.className="attachment";if((a.mime_type||"").startsWith("image/")){el.innerHTML='<button>Loading image…</button>';try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:authHeaders()});if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b);el.innerHTML='<img alt="'+escapeHtml(a.file_name)+'">';el.querySelector("img").src=u;el.onclick=()=>window.open(u,"_blank")}catch{el.innerHTML='<button>Could not load image</button>'}}else{el.innerHTML='<button>▶ '+escapeHtml(a.file_name)+'</button>';el.onclick=()=>openAttachment(a)}box.appendChild(el)}}
async function openAttachment(a){showLoading(true);try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:authHeaders()});if(!r.ok)throw new Error("Could not open attachment");const b=await r.blob(),u=URL.createObjectURL(b);window.open(u,"_blank")}catch(e){toast(e.message)}finally{showLoading(false)}}
function renderReopenRequests(ticketId,list){const box=document.getElementById("reopenWrap");if(!box)return;const pending=list.find(x=>x.status==="pending");if(!pending){box.innerHTML="";return}box.innerHTML='<div class="reopenCard"><b>Store requested reopen</b><p>'+escapeHtml(pending.reason)+'</p><div class="reopenActions"><button onclick="reviewReopen(\''+pending.id+'\',false,\''+ticketId+'\')">Reject</button><button class="approve" onclick="reviewReopen(\''+pending.id+'\',true,\''+ticketId+'\')">Approve & Reopen</button></div></div>'}
async function reviewReopen(requestId,approve,ticketId){showLoading(true);try{await api("/rest/v1/rpc/ops_review_reopen_request",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({p_request_id:requestId,p_approve:approve})});await Promise.all([loadTickets(true),loadNotifications(true)]);await openTicket(ticketId);toast(approve?"Ticket reopened":"Request rejected")}catch(e){toast(e.message)}finally{showLoading(false)}}

async function startTicket(id){showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"in_progress"})});await loadTickets(true);await openTicket(id);toast("Work started")}catch(e){toast(e.message)}finally{showLoading(false)}}
async function acceptTicket(id){
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"accepted"})});await loadTickets(true);closeDetail();render();toast("Ticket accepted")}catch(e){toast(e.message)}finally{showLoading(false)}
}
function waitingForm(id){
  detail.innerHTML='<div class="detailTop"><button onclick="openTicket(\''+id+'\')">‹</button><b>Set Follow-up</b><button></button></div><div class="sheet form"><div class="detailCard"><label>Waiting for</label><select id="waitReason"><option>Supplier</option><option>Landlord</option><option>Contractor</option><option>Staff</option><option>Centre Management</option><option>Other</option></select><label>Follow-up date & time</label><input id="followAt" type="datetime-local"><label>Notes</label><textarea id="waitNote" placeholder="What are we waiting for?"></textarea><button class="primary" onclick="saveWaiting(\''+id+'\')">Save Follow-up</button></div></div>'
}
async function saveWaiting(id){
  const dt=document.getElementById("followAt").value;if(!dt){toast("Choose a follow-up time");return}
  const reason=document.getElementById("waitReason").value+(document.getElementById("waitNote").value.trim()?" · "+document.getElementById("waitNote").value.trim():"");
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"waiting",waiting_reason:reason,follow_up_at:new Date(dt).toISOString()})});await loadTickets(true);closeDetail();render();toast("Follow-up saved")}catch(e){toast(e.message)}finally{showLoading(false)}
}
function completeForm(id){
  detail.innerHTML='<div class="detailTop"><button onclick="openTicket(\''+id+'\')">‹</button><b>Complete Ticket</b><button></button></div><div class="sheet form"><div class="detailCard"><label>Resolution</label><textarea id="resolution" placeholder="What was done to resolve this issue?"></textarea><button class="primary" onclick="completeTicket(\''+id+'\')">Complete Ticket</button></div></div>'
}
async function completeTicket(id){
  const resolution=document.getElementById("resolution").value.trim();if(!resolution){toast("Add a resolution note");return}
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"completed",resolution})});await loadTickets(true);closeDetail();render();toast("Ticket completed")}catch(e){toast(e.message)}finally{showLoading(false)}
}
async function addComment(id){
  const body=document.getElementById("commentBody").value.trim();if(!body)return;
  showLoading(true);try{await api("/rest/v1/ops_ticket_comments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:id,author_id:session.user.id,body})});await openTicket(id);toast("Comment added")}catch(e){toast(e.message)}finally{showLoading(false)}
}

function newTicket(){
  const storeSelect=isHQ()?'<label>Store</label><select id="newStore">'+stores.map(s=>'<option value="'+s.id+'">'+escapeHtml(s.name)+'</option>').join("")+'</select>':'';
  detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>New Ticket</b><button></button></div><div class="sheet form"><div class="detailCard">'+storeSelect+'<label>Title</label><input id="newTitle" placeholder="What needs attention?"><label>Description</label><textarea id="newDesc" placeholder="Describe the issue"></textarea><label>Category</label><select id="newCat">'+["Maintenance","Supplier / Stock","IT / POS","Marketing","HR / Staff","Finance","Landlord / Centre","Health & Safety","Other"].map(x=>'<option>'+x+'</option>').join("")+'</select><label>Priority</label><select id="newPri"><option value="normal">Normal</option><option value="urgent">Urgent</option></select><label>Due date (optional)</label><input id="newDue" type="datetime-local"><label>Photo / video (optional)</label><input id="newFile" type="file" accept="image/*,video/*"><button class="primary" onclick="createTicket()">Submit to HQ</button></div></div>'
}
async function uploadAttachment(ticketId,file){
  if(!file)return;
  const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=ticketId+"/"+Date.now()+"_"+clean;
  const r=await fetch(SB_URL+"/storage/v1/object/ops-ticket-attachments/"+encodeURI(path),{method:"POST",headers:{...authHeaders({"Content-Type":file.type||"application/octet-stream","x-upsert":"false"})},body:file});
  if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||"Attachment upload failed")}
  await api("/rest/v1/ops_ticket_attachments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:ticketId,uploaded_by:session.user.id,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size})});
}
async function createTicket(){
  const title=document.getElementById("newTitle").value.trim();if(!title){toast("Add a title");return}
  const storeId=isHQ()?document.getElementById("newStore").value:profile.store_id;if(!storeId){toast("Your account has no store assigned");return}
  const due=document.getElementById("newDue").value,file=document.getElementById("newFile").files[0];
  const payload={store_id:storeId,created_by:session.user.id,title,description:document.getElementById("newDesc").value.trim(),category:document.getElementById("newCat").value,priority:document.getElementById("newPri").value,due_at:due?new Date(due).toISOString():null};
  showLoading(true);try{
    const created=await api("/rest/v1/ops_tickets",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)});
    if(file&&created&&created[0])await uploadAttachment(created[0].id,file);
    await loadTickets(true);closeDetail();page="tickets";render();toast("Ticket created");
  }catch(e){toast(e.message)}finally{showLoading(false)}
}

if(session)boot();else showLogin();
</script></body></html>
